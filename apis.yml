aid: pendoio
name: Pendo.io
description: >-
  Pendo is a product-experience and product-analytics platform that helps software
  teams understand and guide how users engage with their applications. Its Engage API
  provides programmatic access to the pages, features, guides, visitors, accounts,
  segments, reports, and metadata collected by the Pendo agent, plus a MongoDB-like
  Aggregation API for running structured queries over product-usage events. The API
  authenticates with a per-subscription integration key sent in the
  x-pendo-integration-key header (OAuth 2.0 is additionally published via RFC 8414
  authorization-server metadata), and includes GDPR/CCPA bulk-deletion, segment
  management, in-app guide targeting, and cloud Data Sync export. Pendo was surfaced
  as a portfolio company of Battery Ventures.
