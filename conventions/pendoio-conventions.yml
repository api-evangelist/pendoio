generated: '2026-07-20'
method: derived
source: openapi/pendoio-engage-openapi.yml, https://engageapi.pendo.io/
authentication:
  style: api-key-header
  header: x-pendo-integration-key
  alt: OAuth 2.0 (RFC 8414 metadata at /.well-known/oauth-authorization-server)
  verify_operation: verifyIntegrationKey
  cross_ref: authentication/pendoio-authentication.yml
base_url: https://app.pendo.io/api/v1
regions:
- us: https://app.pendo.io
- us1: https://us1.app.pendo.io
- eu: https://app.eu.pendo.io
- au: https://app.au.pendo.io
- jp: https://app.jpn.pendo.io
idempotency:
  supported: false
  notes: >-
    No idempotency-key header/parameter is documented. Mutations are id-addressed
    (PUT/DELETE on /segment/:id, metadata field paths) which are naturally
    idempotent, but there is no client-supplied idempotency key contract.
pagination:
  style: query-and-aggregation
  notes: >-
    Resource collection endpoints (page, feature, guide) return full lists filtered
    by an optional id query parameter (comma-separated ids). Large-scale paging and
    windowing is handled by the Aggregation API using MongoDB-like operators
    (limit, skip/first/last, filter, group) in the POST /api/v1/aggregation body.
filtering:
  id_parameter: "?id=id1,id2,..."
  base64_lookup: "visitor/:b64_id and account/:b64_id accept base64-encoded ids"
time_windows:
  starttime_param: "history endpoints accept starttime (epoch ms)"
error_envelope:
  format: json
  notes: JSON error bodies; RFC 9457 problem+json is not used. See errors/pendoio-problem-types.yml
rate_limits:
  notes: No published numeric rate-limit table was found in the Postman documentation.
versioning:
  scheme: uri-path
  current: v1
  cross_ref: lifecycle/pendoio-lifecycle.yml
data_export:
  aggregation: POST /api/v1/aggregation (structured event queries)
  data_sync: rotate cloud-storage credentials (GCS/S3/Azure) for bulk Data Sync export
  reports: GET /api/v1/report/:reportId/results.json|.csv
