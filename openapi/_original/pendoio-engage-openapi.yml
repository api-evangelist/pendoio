openapi: 3.0.3
info:
  title: Pendo Engage API
  description: Pendo's Engage API provides programmatic access to product analytics and in-app
    guide data collected by the Pendo agent. It includes resource endpoints for pages, features,
    track events, guides, visitors, accounts, segments, reports, and metadata, plus a powerful
    Aggregation API that runs MongoDB-like structured queries over collected events. Authentication
    uses a per-subscription integration key passed in the x-pendo-integration-key header.
  version: v1
  contact:
    name: Pendo Developers
    url: https://developers.pendo.io/
  x-source: https://engageapi.pendo.io/ (public Postman collection 16265887/Tzm6jvKG)
servers:
- url: https://app.pendo.io
  description: US (default)
- url: https://us1.app.pendo.io
  description: US1
- url: https://app.eu.pendo.io
  description: EU
- url: https://app.au.pendo.io
  description: AU/APAC
- url: https://app.jpn.pendo.io
  description: Japan
security:
- IntegrationKey: []
tags:
- name: Page
- name: Feature
- name: Track
- name: Visitor
- name: Account
- name: Bulk Deletion (GDPR/CCPA)
- name: Segment
- name: Report
- name: Guide
- name: Metadata
- name: Exclude Lists & Servers
- name: Data Sync
- name: Listen
- name: Conversations
- name: Admin
- name: Aggregation
